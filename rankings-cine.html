  <!-- Tipografía base segura + hamburguesa -->
  <style>
    body {
      font-family: Poppins, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    img {
      height: auto;
    }

    /* Hamburguesa accesible */
    .menu-btn {
      position: absolute !important;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    .menu-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      cursor: pointer;
      user-select: none;
    }

    .nav-icon {
      position: relative;
      width: 26px;
      height: 2px;
      background: #555;
      display: inline-block;
      transition: transform .25s ease, background .25s ease;
    }

    .nav-icon::before,
    .nav-icon::after {
      content: "";
      position: absolute;
      left: 0;
      width: 26px;
      height: 2px;
      background: #555;
      transition: transform .25s ease, top .25s ease, opacity .25s ease;
    }

    .nav-icon::before {
      top: -8px;
    }

    .nav-icon::after {
      top: 8px;
    }

    .menu-btn:checked+.menu-icon .nav-icon {
      background: transparent;
    }

    .menu-btn:checked+.menu-icon .nav-icon::before {
      transform: rotate(45deg);
      top: 0;
    }

    .menu-btn:checked+.menu-icon .nav-icon::after {
      transform: rotate(-45deg);
      top: 0;
    }

    @media (min-width: 768px) {
      .menu-icon {
        display: none;
      }
    }
  </style>
