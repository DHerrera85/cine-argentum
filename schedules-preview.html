<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telefe Julio 1992 - Grilla visual</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #101923;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  padding: 24px 18px;
  background: linear-gradient(110deg, #142d4b, #176e89);
}
header h1 { margin: 0 0 8px; font-size: 25px; }
header p { margin: 0; opacity: .85; }
main { padding: 16px; }
.scroll { overflow-x: auto; }
.grid {
  display: grid;
  grid-template-columns: 65px repeat(5, minmax(155px, 1fr));
  grid-template-rows: 46px repeat(24, 52px);
  gap: 2px;
  min-width: 850px;
  background: #223341;
  border: 2px solid #223341;
}
.heading, .hour {
  background: #19374d;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}
.heading { font-size: 13px; }
.hour {
  align-items: flex-start;
  padding-top: 7px;
  font-size: 12px;
  color: #c5d5e3;
}
.program {
  position: relative;
  overflow: hidden;
  background: #24425a;
  border: 1px solid #426077;
  text-decoration: none;
  color: white;
  display: flex;
  flex-direction: column;
}
.program img {
  width: 100%;
  min-height: 0;
  flex: 1;
  object-fit: contain;
  background: #183044;
}
.program .info {
  background: #0b2237;
  padding: 5px;
  text-align: center;
}
.program strong {
  display: block;
  font-size: 12px;
}
.program small {
  display: block;
  margin-top: 3px;
  font-size: 10px;
  color: #b5d4e6;
}
.program.no-image {
  justify-content: center;
  background: linear-gradient(145deg, #285979, #142e48);
}
.program.no-image .info { background: transparent; }
.program.production { border-color: #57b8d7; }
.note { color: #aabccb; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>TELEFE | JULIO 1992</h1>
  <p>Programacion historica - Lunes a viernes - 12:00 a 00:00</p>
</header>
<main>
  <div class="scroll"><div id="grid" class="grid"></div></div>
  <p class="note">
    Vista experimental. Datos originales de schedules.json.
    Los programas con ficha utilizan thumbnails de Cine Argentum.
  </p>
</main>
<script>
const days = ['lunes','martes','miércoles','jueves','viernes'];
const names = ['LUNES','MARTES','MIERCOLES','JUEVES','VIERNES'];
const thumbnails = {
  T0007:'1992-brigada-cola.webp',
  T0001:'1992-amigos-son-los-amigos.webp',
  T0004:'1992-grande-pa.webp',
  T0006:'1992-el-gordo-y-el-flaco.webp',
  T0008:'1992-amores.webp'
};
const grid = document.getElementById('grid');

function minutes(t) {
  const [h,m] = t.split(':').map(Number);
  return h * 60 + m;
}
function node(tag, cls, text) {
  const el = document.createElement(tag);
  el.className = cls;
  if (text !== undefined) el.textContent = text;
  return el;
}
function clock(m) {
  return String(Math.floor(m / 60) % 24).padStart(2,'0') + ':' +
    String(m % 60).padStart(2,'0');
}
function draw(entries) {
  const corner = node('div','heading','HORA');
  corner.style.gridColumn = 1;
  corner.style.gridRow = 1;
  grid.append(corner);

  names.forEach((name,i) => {
    const h = node('div','heading',name);
    h.style.gridColumn = i + 2;
    h.style.gridRow = 1;
    grid.append(h);
  });

  for (let i=0;i<24;i++) {
    const h = node('div','hour',clock(720+i*30));
    h.style.gridColumn = 1;
    h.style.gridRow = i+2;
    grid.append(h);
  }

  days.forEach((day,di) => {
    entries.filter(e => e.days && e.days.includes(day)).forEach(e => {
      let start = minutes(e.start);
      if (start < 720 || start >= 1440) return;

      let end = e.end ? minutes(e.end) : start+30;
      if (end <= start) end += 1440;
      end = Math.min(end,1440);

      const first = Math.floor((start-720)/30);
      const span = Math.max(1,Math.ceil((end-start)/30));
      const id = e.production_id;
      const file = id && thumbnails[id];

      const card = node('div',
        'program ' + (id ? 'production ' : '') + (!file ? 'no-image' : '')
      );
      card.style.gridColumn = di+2;
      card.style.gridRow = (first+2) + ' / span ' + span;

      if (file) {
        const img = document.createElement('img');
        img.src = 'images/schedules-thumbnails/' + file;
        img.alt = e.title;
        card.append(img);
      }

      const info = node('div','info');
      info.append(node('strong','',e.title));
      info.append(node('small','',e.start+' - '+e.end));
      card.append(info);
      grid.append(card);
    });
  });
}

fetch('schedules.json')
  .then(r => {
    if (!r.ok) throw new Error('No se pudo leer schedules.json');
    return r.json();
  })
  .then(data => {
    const period = data.schedules.find(s => s.id === 'schedule-1992-07');
    if (!period) throw new Error('No se encontro julio de 1992');
    const channel = period.channels.find(c => c.channel === 'Telefe');
    if (!channel) throw new Error('No se encontro Telefe');
    draw(channel.entries);
  })
  .catch(err => {
    const p = node('p','note',err.message);
    document.querySelector('main').prepend(p);
  });
</script>
</body>
</html>
